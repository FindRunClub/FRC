name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_readme_screenshots:
        description: Commit fresh screenshots to docs/screenshots (shown in the README)
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: FRCKit tests + app build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test FRCKit (Swift package)
        run: swift test --package-path Packages/FRCKit

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build -quiet \
            -project FindRunClub.xcodeproj \
            -scheme FindRunClub \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch in Simulator and capture screenshots
        run: |
          scripts/capture-screenshots.sh build/DerivedData/Build/Products/Debug-iphonesimulator/FindRunClub.app screenshots
          # Smaller JPEG copies for the README.
          mkdir -p screenshots/readme
          for f in screenshots/*.png; do
            sips -Z 1000 -s format jpeg -s formatOptions 70 "$f" --out "screenshots/readme/$(basename "${f%.png}").jpg" >/dev/null
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  update-readme-screenshots:
    name: Commit README screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.update_readme_screenshots
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: screenshots
          path: screenshots

      - name: Commit screenshots
        run: |
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp screenshots/readme/*.jpg docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Update README screenshots"
          git push
