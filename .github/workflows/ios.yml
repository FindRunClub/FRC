name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: FRCKit tests + app build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test FRCKit (Swift package)
        run: swift test --package-path Packages/FRCKit

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build -quiet \
            -project FindRunClub.xcodeproj \
            -scheme FindRunClub \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch in Simulator and capture screenshots
        run: scripts/capture-screenshots.sh build/DerivedData/Build/Products/Debug-iphonesimulator/FindRunClub.app screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
