name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: FRCKit tests + app build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test FRCKit (Swift package)
        run: swift test --package-path Packages/FRCKit

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build -quiet \
            -project FindRunClub.xcodeproj \
            -scheme FindRunClub \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
